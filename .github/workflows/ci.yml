name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ubuntu-latest'та инде бар / preinstalled on ubuntu-latest
      - run: shellcheck -x bin/ayda bin/kubectl-ayda lib/*.sh install.sh scripts/*.sh tests/unit.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (alif, plural, resolve, i18n)
        run: bash tests/unit.sh

  catalog-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog is in sync with locale/*.po
        run: |
          cp lib/catalog.sh /tmp/committed.sh
          bash scripts/build-catalog.sh >/dev/null
          diff -u /tmp/committed.sh lib/catalog.sh || {
            echo "lib/catalog.sh иске! 'bash scripts/build-catalog.sh' эшләт."; exit 1; }

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke tests
        env:
          AYDA_NO_TEA: "1"
          AYDA_PLAIN: "1"
        run: |
          set -e
          bash bin/ayda ярдәм   >/dev/null
          bash bin/ayda сүзлек  >/dev/null
          bash bin/ayda тукай   >/dev/null
          bash bin/ayda версия  >/dev/null
          # билгесез фигыль → exit 64 / unknown verb must exit 64
          rc=0; bash bin/ayda zzzz-unknown || rc=$?
          test "$rc" -eq 64
          # тәрҗемә дөресме? / translation sanity (kubectl юк, exit 127 көтелә)
          out=$(AYDA_KUBECTL=/nonexistent AYDA_PLAIN= AYDA_FORCE_FUN=1 bash bin/ayda күрсәт кузаклар 2>&1 || true)
          echo "$out" | grep -q "get pods"
          echo "◆ Барлык smoke-тестлар узды / all smoke tests passed"
