name: release
# Тег этелгәндә GitHub Release ясый / creates a GitHub Release on tag push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          tar czf "tatarnetes-${GITHUB_REF_NAME}.tar.gz" \
            bin lib data locale docs plugins scripts completion install.sh \
            LICENSE NOTICE README.md MANIFESTO.md CODE_OF_CONDUCT.md
      - name: Krew manifest for this release
        # plugins/ayda.yaml — соңгы чыккан релизга күрсәтә; монда яңа тегка
        # uri/sha256 белән яңа манифест ясала һәм релизга беркетелә.
        # Render plugins/ayda.yaml for this tag (version, uri, sha256) and attach it.
        run: |
          sha="$(sha256sum "tatarnetes-${GITHUB_REF_NAME}.tar.gz" | cut -d' ' -f1)"
          sed -E \
            -e "s|^(  version: ).*|\1${GITHUB_REF_NAME}|" \
            -e "s|(releases/download/)[^/]+/tatarnetes-[^ ]+\.tar\.gz|\1${GITHUB_REF_NAME}/tatarnetes-${GITHUB_REF_NAME}.tar.gz|" \
            -e "s|^(      sha256: ).*|\1\"${sha}\"|" \
            plugins/ayda.yaml > ayda.yaml
          grep -q "${sha}" ayda.yaml && grep -q "download/${GITHUB_REF_NAME}/" ayda.yaml
      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Татарнетес ${GITHUB_REF_NAME}" \
            --generate-notes \
            "tatarnetes-${GITHUB_REF_NAME}.tar.gz" ayda.yaml

  freeze-image:
    # Тыю вебхугы образы / the change-freeze webhook image, tagged like the release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: freeze/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tatar-ncf/tatarnetes-freeze:${{ github.ref_name }}
