name: release
# Тег этелгәндә GitHub Release ясый / creates a GitHub Release on tag push.
on:
  push:
    tags:
      - "v*"
  # Сынау өчен: образ һәм чарт җыела, бернәрсә дә чыгарылмый.
  # Dry run: builds the multi-arch freeze image and packages its chart,
  # pushes nothing and creates no release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          tar czf "tatarnetes-${GITHUB_REF_NAME}.tar.gz" \
            bin lib data locale docs plugins scripts completion install.sh \
            LICENSE NOTICE README.md MANIFESTO.md CODE_OF_CONDUCT.md
      - name: Krew manifest for this release
        # plugins/ayda.yaml — соңгы чыккан релизга күрсәтә; монда яңа тегка
        # uri/sha256 белән яңа манифест ясала һәм релизга беркетелә.
        # Render plugins/ayda.yaml for this tag (version, uri, sha256) and attach it.
        run: |
          sha="$(sha256sum "tatarnetes-${GITHUB_REF_NAME}.tar.gz" | cut -d' ' -f1)"
          sed -E \
            -e "s|^(  version: ).*|\1${GITHUB_REF_NAME}|" \
            -e "s|(releases/download/)[^/]+/tatarnetes-[^ ]+\.tar\.gz|\1${GITHUB_REF_NAME}/tatarnetes-${GITHUB_REF_NAME}.tar.gz|" \
            -e "s|^(      sha256: ).*|\1\"${sha}\"|" \
            plugins/ayda.yaml > ayda.yaml
          grep -q "${sha}" ayda.yaml && grep -q "download/${GITHUB_REF_NAME}/" ayda.yaml
      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Татарнетес ${GITHUB_REF_NAME}" \
            --generate-notes \
            "tatarnetes-${GITHUB_REF_NAME}.tar.gz" ayda.yaml

  freeze-image:
    # Тыю вебхугы образы / the change-freeze webhook image, tagged like the release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: freeze/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/tatar-ncf/tatarnetes-freeze:${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
      - uses: azure/setup-helm@v4
      - name: Package the chart
        # Чарт версиясе — релиз теге (v өлешсез) / the chart is versioned as the release.
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_EVENT_NAME" = push ] || version="0.0.0-dry-run"
          helm lint charts/tatarnetes-freeze
          helm package charts/tatarnetes-freeze --version "$version" \
            --app-version "${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}" -d dist
          ls -l dist
      - name: Push the chart
        if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/tatarnetes-freeze-*.tgz oci://ghcr.io/tatar-ncf/charts
