# Krew плагин манифесты / krew plugin manifest for `kubectl ayda`.
# Урнаштыру / install (custom manifest):
#   kubectl krew install --manifest=plugins/ayda.yaml
# Яки PATH'ка bin/kubectl-ayda куеп: «kubectl ayda күрсәт кузаклар».
# Or just put bin/kubectl-ayda on PATH: `kubectl ayda күрсәт кузаклар`.
#
# Бу файл соңгы чыккан релизга (v2.1.0) күрсәтә. Яңа тег куелганда release.yml
# аның version/uri/sha256'ын яңартып, `ayda.yaml` итеп релизга беркетә.
# This file points at the last published release (v2.1.0). On every tag,
# release.yml renders it with that tag's version/uri/sha256 and attaches the
# result to the GitHub Release as `ayda.yaml`.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ayda
spec:
  version: v2.1.0
  homepage: https://github.com/tatar-ncf/tatarnetes
  shortDescription: Tatar-native kubectl (Татарнетес — милли kubectl)
  description: |
    ayda — милли kubectl кабыгы. Татарча әмерләр kubectl'га тәрҗемә ителә,
    түбәтәйле йөзләр, Тукай юллары, чәй тәнәфесе. Латин керем дә эшли.
    A Tatar-native kubectl wrapper: Tatar commands, skullcap faces, Tukay
    verses, tea breaks. Latin input supported. AYDA_ALIF=cyrl|latin|arab.
  caveats: |
    kubectl һәм bash кирәк / requires kubectl and bash.

    Tab-тулыландыру / shell completion (v1.37.1-tatar.0 һәм соңрак / and later):
      kubectl ayda <Tab>:  ln -s "$(dirname "$(readlink ~/.krew/bin/kubectl-ayda)")/kubectl_complete-ayda" ~/.krew/bin/
      ayda (bash/zsh):     see completion/ in the plugin directory and the README.
  platforms:
    - selector:
        matchExpressions:
          - key: os
            operator: In
            values: [darwin, linux]
      uri: https://github.com/tatar-ncf/tatarnetes/releases/download/v2.1.0/tatarnetes-v2.1.0.tar.gz
      sha256: "e5d1efad256926a8e871df402e6b6cb371e07d09f2b88f9f9ff8fcd83c10afdd"
      bin: bin/kubectl-ayda
      files:
        - from: "*"
          to: "."
